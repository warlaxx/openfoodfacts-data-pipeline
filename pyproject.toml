[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "off-pipeline"
version = "0.1.0"
description = "Lakehouse pipeline on Open Food Facts data (PySpark + Delta Lake, medallion architecture)."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pyspark==4.0.1",
    "delta-spark==4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "chispa>=0.10",
    "ruff>=0.6",
    "jupyterlab>=4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests that need a real Spark session with Delta (slower)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
